<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IL2CPP Offset Finder — Open Storage</title>
  <style>
    :root {
      --bg: #090d16;
      --panel: #111827;
      --panel-2: #1a2438;
      --border: #28354f;
      --text: #e5edf8;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    h1 { font-size: 1.15rem; margin: 0; }

    .badge {
      font-size: 0.78rem;
      color: #93c5fd;
      background: rgba(59, 130, 246, 0.14);
      border: 1px solid rgba(59, 130, 246, 0.35);
      padding: 4px 10px;
      border-radius: 999px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    @media (min-width: 680px) {
      .controls { grid-template-columns: auto 1fr auto auto; }
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
    }

    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-storage { background: var(--accent); color: #fff; }
    .btn-scan { background: var(--success); color: #04130d; }
    .btn-stop { background: var(--danger); color: #fff; }
    .btn-secondary {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    input[type="text"] {
      width: 100%;
      padding: 11px 13px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #060911;
      color: var(--text);
      font-size: 0.92rem;
    }

    .options-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .opt-group { display: flex; flex-wrap: wrap; gap: 14px; }
    label.chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }

    .file-info {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 10px;
      word-break: break-word;
    }

    .file-info strong { color: var(--text); }
    progress { width: 100%; height: 12px; margin-bottom: 12px; }
    .actions-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }

    .output-wrap {
      background: #05080f;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      min-height: 240px;
      max-height: 500px;
      overflow: auto;
    }

    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.82rem;
      line-height: 1.45;
      color: #dbeafe;
    }

    .toast { margin-left: auto; font-size: 0.82rem; color: var(--success); align-self: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>IL2CPP Offset Extractor</h1>
      <span class="badge">Leitura em Blocos (4 MB)</span>
    </div>

    <input id="fileInput" type="file" accept=".cs,.txt,*/*" style="display: none;" />

    <div class="controls">
      <button id="openStorageBtn" class="btn-storage" type="button">Open Storage</button>
      <input id="queryInput" type="text" placeholder="Ex.: Player, Damage, Coin, Rpc" />
      <button id="scanBtn" class="btn-scan" type="button">Analisar</button>
      <button id="stopBtn" class="btn-stop" type="button" disabled>Parar</button>
    </div>

    <div class="options-row">
      <div class="opt-group">
        <label class="chk">
          <input id="onlyOffsetsChk" type="checkbox" checked />
          <span>Resumo limpo (Linha + RVA / Offset / VA)</span>
        </label>
        <label class="chk">
          <input id="autoScanChk" type="checkbox" checked />
          <span>Buscar ao escolher arquivo se já houver termo</span>
        </label>
      </div>
      <div id="statsText">0 resultados</div>
    </div>

    <div class="file-info" id="fileInfo">
      <strong>Arquivo:</strong> nenhum selecionado. Clique em <strong>Open Storage</strong> para escolher o <code>dump.cs</code>.
    </div>

    <progress id="progressBar" value="0" max="100"></progress>

    <div class="actions-bar">
      <button id="copyBtn" class="btn-secondary" type="button" disabled>Copiar para
